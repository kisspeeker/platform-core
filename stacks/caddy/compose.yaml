---

services:
  caddy:
    image: ${CADDY_IMAGE:-registry.gitlab.com/kisspeeker-dev/platform-core/caddy-cloudflare:latest}
    pull_policy: ${PULL_POLICY:-missing}
    container_name: caddy
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
      - /config:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    env_file:
      - /opt/platform/secrets/caddy/caddy.env
    ports:
      - "${MESH_IP:?set MESH_IP}:80:80"
      - "${MESH_IP:?set MESH_IP}:443:443"
    volumes:
      - /opt/platform/stacks/caddy/config:/etc/caddy:ro
      - /opt/platform/data/caddy:/data
      - /opt/platform/logs/caddy:/var/log/caddy
    networks:
      - proxy

networks:
  proxy:
    external: true
